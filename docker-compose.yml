version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce_db
    environment:
      SA_PASSWORD: "${SA_PASSWORD:?Set SA_PASSWORD in .env}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - dbdata:/var/opt/mssql

  redis:
    image: redis:7
    container_name: ecommerce_redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: eCommerce.API/Dockerfile
    container_name: ecommerce_api
    depends_on:
      - db
      - redis
    init: true
    stop_grace_period: 30s
    environment:
      ConnectionStrings__DatabaseConnection: "${API_CONNECTION_STRING:?Set API_CONNECTION_STRING in .env}"
      Jwt__Issuer: "ecommerce-demo"
      Jwt__Audience: "ecommerce-demo"
      Jwt__Secret: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      AzureServiceBus__Enabled: "${AZURE_SERVICE_BUS_ENABLED:-false}"
      AzureServiceBus__ConnectionString: "${AZURE_SERVICE_BUS_CONNECTION_STRING:-}"
      AzureServiceBus__FullyQualifiedNamespace: "${AZURE_SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE:-}"
      AzureServiceBus__TopicName: "${AZURE_SERVICE_BUS_TOPIC_NAME:-order-events}"
    ports:
      - "5000:8080"

  ui:
    build:
      context: .
      dockerfile: eCommerce.UI/Dockerfile
    container_name: ecommerce_ui
    depends_on:
      - api
    environment:
      eCommerceAPI__BaseAddress: "http://api:8080"
    ports:
      - "5001:8080"

  messaging-worker:
    build:
      context: .
      dockerfile: eCommerce.Messaging.Worker/Dockerfile
    container_name: ecommerce_messaging_worker
    depends_on:
      - db
    init: true
    stop_grace_period: 30s
    environment:
      ConnectionStrings__DatabaseConnection: "${API_CONNECTION_STRING:?Set API_CONNECTION_STRING in .env}"
      AzureServiceBus__Enabled: "${AZURE_SERVICE_BUS_ENABLED:-false}"
      AzureServiceBus__ConnectionString: "${AZURE_SERVICE_BUS_CONNECTION_STRING:-}"
      AzureServiceBus__FullyQualifiedNamespace: "${AZURE_SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE:-}"
      AzureServiceBus__TopicName: "${AZURE_SERVICE_BUS_TOPIC_NAME:-order-events}"

volumes:
  dbdata:
    driver: local

