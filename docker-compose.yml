version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce_db
    environment:
      SA_PASSWORD: "Rahul@123456789"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - dbdata:/var/opt/mssql

  redis:
    image: redis:7
    container_name: ecommerce_redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: eCommerce.API/Dockerfile
    container_name: ecommerce_api
    depends_on:
      - db
      - redis
    environment:
      ConnectionStrings__DatabaseConnection: "Server=db,1433;Database=ecommerce;User Id=sa;Password=Rahul@123456789;TrustServerCertificate=True;"
      Jwt__Issuer: "ecommerce-demo"
      Jwt__Audience: "ecommerce-demo"
      Jwt__Secret: "ChangeThisVerySecretKeyForDemoOnly"
    ports:
      - "5000:8080"

  ui:
    build:
      context: .
      dockerfile: eCommerce.UI/Dockerfile
    container_name: ecommerce_ui
    depends_on:
      - api
    environment:
      eCommerceAPI__BaseAddress: "http://api:8080"
    ports:
      - "5001:8080"

volumes:
  dbdata:
    driver: local

